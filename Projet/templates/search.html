<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/static/style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recherche - User Friendly</title>
    <style>
        .search-container {
            background: linear-gradient(135deg, var(--color-surface) 0%, var(--color-bg) 100%);
            padding: 3rem 2rem;
            margin: 2rem 0;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(255, 73, 53, 0.2);
        }

        .search-box {
            max-width: 700px;
            margin: 0 auto;
            text-align: center;
        }

        .search-box h2 {
            color: var(--color-accent);
            margin-bottom: 2rem;
            font-size: 1.8rem;
            text-shadow: 0 2px 10px rgba(255, 73, 53, 0.3);
        }

        .search-input-group {
            display: flex;
            gap: 10px;
            margin-top: 1.5rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        #searchInput {
            flex: 1;
            min-width: 200px;
            padding: 12px 20px;
            font-size: 16px;
            border: 2px solid var(--color-accent);
            border-radius: 8px;
            background: var(--color-surface);
            color: white;
            transition: all 0.3s ease;
        }

        #searchInput:focus {
            outline: none;
            box-shadow: 0 0 15px rgba(255, 73, 53, 0.5);
            border-color: var(--color-accent);
            transform: translateY(-2px);
        }

        #searchInput::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        #searchBtn {
            padding: 12px 35px;
            font-size: 16px;
            background: var(--color-accent);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 73, 53, 0.3);
        }

        #searchBtn:hover {
            background: #f7461e;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 73, 53, 0.5);
        }

        #searchBtn:active {
            transform: translateY(0);
        }

        #results {
            margin-top: 3rem;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="/">Accueil</a></li>
                <li><a href="/recherche">Recherche</a></li>
                <li><a href="/about.html">À propos</a></li>
                <li><a href="/contact.html">Contact</a></li>
            </ul>
        </nav>
        <h1>Bienvenue sur User Friendly</h1>
    </header>

    <div class="search-container">
        <div class="search-box">
            <h2>🔍 Rechercher un artiste</h2>
            <div class="search-input-group">
                <input type="text" id="searchInput" placeholder="Entrez le nom d'un artiste...">
                <button id="searchBtn">Rechercher</button>
            </div>
        </div>

        <div class="cards" id="results"></div>
    </div>

    <script>
        document.getElementById('searchBtn').addEventListener('click', function() {
            const query = document.getElementById('searchInput').value;
            if (query.trim()) {
                fetch('/api/search?q=' + encodeURIComponent(query))
                    .then(response => response.json())
                    .then(data => {
                        const container = document.getElementById('results');
                        container.innerHTML = '';
                        if (data && data.length > 0) {
                            data.forEach(artist => {
                                const card = document.createElement('a');
                                card.href = '/artist?id=' + artist.ID;
                                card.style.textDecoration = 'none';
                                card.innerHTML = `
                                    <article class="card">
                                        <header><h2>${artist.Name}</h2></header>
                                        <img src="${artist.Image}" alt="${artist.Name}" />
                                        <div class="content">
                                            <p>
                                                <strong>Fondation:</strong> ${artist.CreationDate}<br>
                                                <strong>Premier album:</strong> ${artist.FirstAlbum}<br>
                                                <strong>Membres:</strong> ${artist.Members.length}
                                            </p>
                                        </div>
                                    </article>
                                `;
                                container.appendChild(card);
                            });
                        } else {
                            container.innerHTML = '<p>Aucun artiste trouvé pour "' + query + '"</p>';
                        }
                    })
                    .catch(error => {
                        console.error('Erreur:', error);
                        document.getElementById('results').innerHTML = '<p>Une erreur est survenue</p>';
                    });
            }
        });

        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('searchBtn').click();
            }
        });
    </script>
</body>
</html>
